<button type="button" class="btn btn-sm btn-outline-primary" (click)="toggleQR()" title="QR code" i18n-title>
  <i-bs width="1.2em" height="1.2em" name="upc-scan"></i-bs>
</button>
@if (showQR) {
  <div class="qr-popover card shadow-sm position-absolute p-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <small class="fw-bold text-muted" i18n>Scan to open document</small>
      <button type="button" class="btn-close btn-close-sm" (click)="showQR = false"></button>
    </div>
    @if (qrDataUrl) {
      <img [src]="qrDataUrl" alt="QR code" class="d-block mx-auto" width="200" height="200" />
    } @else {
      <div class="d-flex justify-content-center align-items-center" style="width:200px;height:200px">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
      </div>
    }
  </div>
}
