<!doctype html>

{% load static i18n %}

<html lang="en" data-bs-theme="auto">
<head>
	<meta charset="utf-8">
	<title>Paperless-ngx</title>
	<base href="{% url 'base' %}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="cookie_prefix" content="{{cookie_prefix}}">
	<meta name="robots" content="noindex,nofollow">
	<meta name="author" content="The Paperless-ngx Team">
	<link rel="icon" type="image/x-icon" href="{% firstof APP_FAVICON 'favicon.ico' %}">
	<link rel="manifest" href="{% static webmanifest %}">
	<link rel="stylesheet" href="{% static styles_css %}">
	<link rel="apple-touch-icon" href="{% static apple_touch_icon %}">
</head>
<body>
	<pngx-root>
		<script type="text/javascript">
			(function() {
				var img = document.getElementById('loading-logo-img');
				img.onload = function() {
					var svg = document.getElementById('loading-logo-svg');
					if (svg) svg.style.display = 'none';
					img.style.display = '';
				};
				img.src = '/logo/';
				setTimeout(function() {
					var warning = document.getElementsByClassName('warning').item(0);
					if (warning) {
						warning.classList.remove('hide');
						warning.classList.add('show');
					}
				}, 8000);
			})();
		</script>
		<style type="text/css">
			html, body {
				width: 100%;
				height: 100%;
			}
			#loading-splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: var(--bs-body-bg, #fff);
				color: var(--bs-body-color, #212529);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				z-index: 9999;
			}
			#loading-splash img, #loading-splash svg {
				width: 80px;
				height: auto;
				color: var(--bs-primary, #17541f);
				max-height: 80px;
				object-fit: contain;
			}
			#loading-splash svg.logo {
				width: auto;
				max-width: 240px;
				height: 6em;
			}
			#loading-splash svg.logo .leaf {
				fill: var(--bs-primary) !important;
			}
			#loading-splash svg.logo .text {
				fill: var(--bs-body-color) !important;
			}
			#loading-text {
				margin-top: 1.5rem;
				font-size: 1.1rem;
				opacity: 0.7;
			}
			.warning {
				font-size: 0.875rem;
			}
			.warning.hide {
				display: none;
			}
			.warning.show {
				display: block;
			}
		</style>
		<div id="loading-splash">
			<img id="loading-logo-img" style="display:none" alt="{% translate 'Logo' %}" />
			{% include "paperless-ngx/snippets/svg_logo.html" with extra_attrs="id='loading-logo-svg' class='logo mb-2' height='6em'" %}
			<div id="loading-text">{% translate "Loading ..." %}</div>
			<p class="warning m-auto mt-3 small fade hide">{% translate "Still here?! Hmm, something might be wrong." %} <a href="https://docs.paperless-ngx.com">{% translate "Here's a link to the docs." %}</a></p>
		</div>
		<script type="text/javascript">{# Pass Django messages to Angular frontend #}
			window.DJANGO_MESSAGES = [
				{% for message in messages %}
					{ level: "{{ message.level_tag | escapejs }}", message: "{{ message | escapejs }}" },
				{% endfor %}
			]
		</script>
	</pngx-root>
	<script src="{% static runtime_js %}" defer></script>
	<script src="{% static polyfills_js %}" defer></script>
	<script src="{% static main_js %}" defer></script>
</body>
</html>
